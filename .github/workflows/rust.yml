name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable check --locked -p gin-tonic --no-default-features --features generator
      - run: cargo +stable check --locked -p gin-tonic --no-default-features --features tonic
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --lib
